!=============================================================================
! TSN switch (Comware-family CLI) — port→TC ingress classifier + Qbv 4-slot
! TDMA + Byzantine-port containment. Tested on a 1 Gbit/s TSN-capable switch
! with 16-entry Qbv per port (per-entry interval ceiling 262 136 ns).
!
! This script reproduces the design that runs on the test switch. Pasting
! it into the switch CLI (in `system-view`) recreates the configuration end
! to end, after which `display tsn qbv interface` and `display qos policy
! interface` should match.
!
! Topology (party / host / TSN-IP / switch port / internal TC):
!   Party  Host     TSN-IP          Switch port    Internal TC
!   ────   ──────   ──────────────  ─────────────  ────────────────────
!   admin  server5  192.168.1.100   GigE1/0/1      (no policy — admin)
!   P4     server4  192.168.1.14    GigE1/0/4      TC0  (deny / Byzantine)
!   P0     coord    192.168.1.10    GigE1/0/5      TC4
!   P3     server3  192.168.1.13    GigE1/0/6      TC1
!   P2     server2  192.168.1.12    GigE1/0/7      TC2
!   P1     server1  192.168.1.11    GigE1/0/8      TC3
!   (TC5 is the always-on control/PTP class; never assigned by the
!    classifier — it stays open in every Qbv slot to carry gPTP / BPDU /
!    spanning-tree traffic.)
!
! Qbv schedule (identical on the four "honest" egress ports GE1/0/5..8):
!   16 entries × 262 136 ns = 4 194 176 ns ≈ 4.19 ms cycle.
!
!   slot 1  idx 1..4   gate 00110000 (0x30) — TC4+TC5  → P0 (coord)   transmits
!   slot 2  idx 5..8   gate 00101000 (0x28) — TC3+TC5  → P1 (server1) transmits
!   slot 3  idx 9..12  gate 00100100 (0x24) — TC2+TC5  → P2 (server2) transmits
!   slot 4  idx 13..16 gate 00100010 (0x22) — TC1+TC5  → P3 (server3) transmits
!
!   TC0 is NEVER open on these ports → server4-sourced frames (reclassified
!   to TC0 at ingress) cannot egress to any honest party. Defense in depth.
!
! server4's port (GE1/0/4):
!   - Qbv DISABLED on egress (does not need a slot — never transmits to
!     honest parties; receives normally so honest broadcasts reach it).
!   - Per-port ingress CIR cap of 8 kbps to prevent flood-the-fabric
!     attacks before classification.
!
! Base-time: 1 609 731 273 sec TAI (= 2021-01-04 04:14:33 TAI). The same
! value is used by the host-side `taprio` on eno2 — the two are anchored
! together so host slots line up with switch slots.
!=============================================================================

system-view

!------------------------------------------------------------------------------
! 1) Ingress port → TC classifier
!
! Comware quirk: `if-match inbound-interface <iface>` is not a valid keyword
! in this build. Use `if-match any` and rely on the per-port `qos apply
! policy ... inbound` to scope it to a single port.
!
! Behavior verb: `remark local-precedence N` — sets the *internal* TC used
! by Qbv egress gating. (`remark dot1p` would only rewrite the VLAN-tag
! PCP, which is the wrong layer.)
!------------------------------------------------------------------------------

! ---- P0 / coord    / GE1/0/5 → TC4 ----
traffic classifier  cls_port_coord operator and
 if-match any
quit
traffic behavior    beh_port_coord
 remark local-precedence 4
quit
qos policy          pol_port_coord
 classifier cls_port_coord behavior beh_port_coord
quit

! ---- P1 / server1  / GE1/0/8 → TC3 ----
traffic classifier  cls_port_server1 operator and
 if-match any
quit
traffic behavior    beh_port_server1
 remark local-precedence 3
quit
qos policy          pol_port_server1
 classifier cls_port_server1 behavior beh_port_server1
quit

! ---- P2 / server2  / GE1/0/7 → TC2 ----
traffic classifier  cls_port_server2 operator and
 if-match any
quit
traffic behavior    beh_port_server2
 remark local-precedence 2
quit
qos policy          pol_port_server2
 classifier cls_port_server2 behavior beh_port_server2
quit

! ---- P3 / server3  / GE1/0/6 → TC1 ----
traffic classifier  cls_port_server3 operator and
 if-match any
quit
traffic behavior    beh_port_server3
 remark local-precedence 1
quit
qos policy          pol_port_server3
 classifier cls_port_server3 behavior beh_port_server3
quit

! ---- P4 / server4  / GE1/0/4 → TC0  (deny channel) ----
traffic classifier  cls_port_server4 operator and
 if-match any
quit
traffic behavior    beh_port_server4
 remark local-precedence 0
quit
qos policy          pol_port_server4
 classifier cls_port_server4 behavior beh_port_server4
quit

!------------------------------------------------------------------------------
! 2) Apply policies inbound on each party-facing port
!------------------------------------------------------------------------------

interface GigabitEthernet 1/0/5
 qos apply policy pol_port_coord inbound
quit

interface GigabitEthernet 1/0/8
 qos apply policy pol_port_server1 inbound
quit

interface GigabitEthernet 1/0/7
 qos apply policy pol_port_server2 inbound
quit

interface GigabitEthernet 1/0/6
 qos apply policy pol_port_server3 inbound
quit

interface GigabitEthernet 1/0/4
 qos apply policy pol_port_server4 inbound
quit

!------------------------------------------------------------------------------
! 3) Qbv 4-slot TDMA on the four honest egress ports
!
! Same schedule body installed on GE1/0/5, /6, /7, /8.
!
!   cycle-time   = 4 194 176 / 1 000 000 000 sec  ≈ 4.19 ms
!   base-time    = 1 609 731 273 sec, 0 ns        (TAI; anchored)
!   default gate = 11111111  (all-open; used outside the control list, but
!                              control list spans the full cycle so this is
!                              only a fallback)
!
!   16 entries × 262 136 ns each (hardware ceiling per entry).
!------------------------------------------------------------------------------

interface GigabitEthernet 1/0/5
 tsn qbv gate-state 255
 tsn qbv cycle-time numerator 4194176 denominator 1000000000
 tsn qbv base-time seconds 1609731273 nanoseconds 0
 tsn qbv control-list index 1  gate-state 48 interval 262136
 tsn qbv control-list index 2  gate-state 48 interval 262136
 tsn qbv control-list index 3  gate-state 48 interval 262136
 tsn qbv control-list index 4  gate-state 48 interval 262136
 tsn qbv control-list index 5  gate-state 40 interval 262136
 tsn qbv control-list index 6  gate-state 40 interval 262136
 tsn qbv control-list index 7  gate-state 40 interval 262136
 tsn qbv control-list index 8  gate-state 40 interval 262136
 tsn qbv control-list index 9  gate-state 36 interval 262136
 tsn qbv control-list index 10 gate-state 36 interval 262136
 tsn qbv control-list index 11 gate-state 36 interval 262136
 tsn qbv control-list index 12 gate-state 36 interval 262136
 tsn qbv control-list index 13 gate-state 34 interval 262136
 tsn qbv control-list index 14 gate-state 34 interval 262136
 tsn qbv control-list index 15 gate-state 34 interval 262136
 tsn qbv control-list index 16 gate-state 34 interval 262136
 tsn qbv enable
 tsn qbv config-change
quit

interface GigabitEthernet 1/0/6
 tsn qbv gate-state 255
 tsn qbv cycle-time numerator 4194176 denominator 1000000000
 tsn qbv base-time seconds 1609731273 nanoseconds 0
 tsn qbv control-list index 1  gate-state 48 interval 262136
 tsn qbv control-list index 2  gate-state 48 interval 262136
 tsn qbv control-list index 3  gate-state 48 interval 262136
 tsn qbv control-list index 4  gate-state 48 interval 262136
 tsn qbv control-list index 5  gate-state 40 interval 262136
 tsn qbv control-list index 6  gate-state 40 interval 262136
 tsn qbv control-list index 7  gate-state 40 interval 262136
 tsn qbv control-list index 8  gate-state 40 interval 262136
 tsn qbv control-list index 9  gate-state 36 interval 262136
 tsn qbv control-list index 10 gate-state 36 interval 262136
 tsn qbv control-list index 11 gate-state 36 interval 262136
 tsn qbv control-list index 12 gate-state 36 interval 262136
 tsn qbv control-list index 13 gate-state 34 interval 262136
 tsn qbv control-list index 14 gate-state 34 interval 262136
 tsn qbv control-list index 15 gate-state 34 interval 262136
 tsn qbv control-list index 16 gate-state 34 interval 262136
 tsn qbv enable
 tsn qbv config-change
quit

interface GigabitEthernet 1/0/7
 tsn qbv gate-state 255
 tsn qbv cycle-time numerator 4194176 denominator 1000000000
 tsn qbv base-time seconds 1609731273 nanoseconds 0
 tsn qbv control-list index 1  gate-state 48 interval 262136
 tsn qbv control-list index 2  gate-state 48 interval 262136
 tsn qbv control-list index 3  gate-state 48 interval 262136
 tsn qbv control-list index 4  gate-state 48 interval 262136
 tsn qbv control-list index 5  gate-state 40 interval 262136
 tsn qbv control-list index 6  gate-state 40 interval 262136
 tsn qbv control-list index 7  gate-state 40 interval 262136
 tsn qbv control-list index 8  gate-state 40 interval 262136
 tsn qbv control-list index 9  gate-state 36 interval 262136
 tsn qbv control-list index 10 gate-state 36 interval 262136
 tsn qbv control-list index 11 gate-state 36 interval 262136
 tsn qbv control-list index 12 gate-state 36 interval 262136
 tsn qbv control-list index 13 gate-state 34 interval 262136
 tsn qbv control-list index 14 gate-state 34 interval 262136
 tsn qbv control-list index 15 gate-state 34 interval 262136
 tsn qbv control-list index 16 gate-state 34 interval 262136
 tsn qbv enable
 tsn qbv config-change
quit

interface GigabitEthernet 1/0/8
 tsn qbv gate-state 255
 tsn qbv cycle-time numerator 4194176 denominator 1000000000
 tsn qbv base-time seconds 1609731273 nanoseconds 0
 tsn qbv control-list index 1  gate-state 48 interval 262136
 tsn qbv control-list index 2  gate-state 48 interval 262136
 tsn qbv control-list index 3  gate-state 48 interval 262136
 tsn qbv control-list index 4  gate-state 48 interval 262136
 tsn qbv control-list index 5  gate-state 40 interval 262136
 tsn qbv control-list index 6  gate-state 40 interval 262136
 tsn qbv control-list index 7  gate-state 40 interval 262136
 tsn qbv control-list index 8  gate-state 40 interval 262136
 tsn qbv control-list index 9  gate-state 36 interval 262136
 tsn qbv control-list index 10 gate-state 36 interval 262136
 tsn qbv control-list index 11 gate-state 36 interval 262136
 tsn qbv control-list index 12 gate-state 36 interval 262136
 tsn qbv control-list index 13 gate-state 34 interval 262136
 tsn qbv control-list index 14 gate-state 34 interval 262136
 tsn qbv control-list index 15 gate-state 34 interval 262136
 tsn qbv control-list index 16 gate-state 34 interval 262136
 tsn qbv enable
 tsn qbv config-change
quit

!------------------------------------------------------------------------------
! 4) server4 port — Qbv OFF, ingress CIR cap 8 kbps
!
! server4 cannot reach any honest party via egress (TC0 never opens on
! GE1/0/5..8) so no Qbv slot is needed. We disable Qbv on its own port to
! allow it to receive normally.
!
! The 8 kbps CIR cap is the lowest allowed by this Comware build.
!------------------------------------------------------------------------------

interface GigabitEthernet 1/0/4
 undo tsn qbv enable
 qos lr inbound cir 8
quit

!------------------------------------------------------------------------------
! 5) Save running-config
!------------------------------------------------------------------------------

quit
save force
